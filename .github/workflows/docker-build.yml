# Construit l'image stdio a chaque poussee.
#
# Pourquoi ce workflow existe : Glama note la maintenance d'un depot, et son
# rapport signalait « CI status unavailable ». Un depot sans integration
# continue est indistinguable d'un depot dont les builds echouent -- l'absence
# de signal se lit comme un mauvais signal.
#
# Le build et le handshake stdio hors-ligne DOIVENT faire echouer le job.
# La verification du serveur heberge, non : elle depend de synergieloc.fr,
# et une CI rouge par intermittence vaut moins que pas de CI du tout.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Offline stdio handshake
        run: npm ci && npm test

      - name: Build the stdio image
        run: docker build -t synergieloc-mcp .

      - name: Image reaches the hosted server
        continue-on-error: true
        run: |
          set +e
          npm ci
          MCP_URL=https://synergieloc.fr/mcp timeout 30 npm test \
            && echo "OK: tools/list a joint le serveur heberge" \
            || echo "AVERTISSEMENT: serveur heberge non confirme"
